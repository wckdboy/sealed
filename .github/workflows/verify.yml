  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: '17' }
  #     - run: cd android && ./gradlew :app:assembleDebug :app:testDebugUnitTest
