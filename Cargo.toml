[workspace]
resolver = "2"
members = ["crates/vault-core", "crates/vault-api", "crates/vault-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.82"

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
